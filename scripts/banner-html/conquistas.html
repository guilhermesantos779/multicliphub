<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:300px; overflow:hidden; font-family:'Inter',Arial,sans-serif; }
  .banner {
    position:relative; width:1200px; height:300px; overflow:hidden;
    background:
      radial-gradient(ellipse 70% 110% at 20% 0%, rgba(0,229,160,0.28), transparent 55%),
      radial-gradient(ellipse 70% 110% at 80% 100%, rgba(145,70,255,0.22), transparent 55%),
      linear-gradient(135deg, #050a08 0%, #050507 50%, #0a060f 100%);
  }
  .banner::before {
    content:''; position:absolute; inset:-50%;
    background:
      radial-gradient(circle at 30% 40%, rgba(0,229,160,0.18), transparent 25%),
      radial-gradient(circle at 70% 60%, rgba(145,70,255,0.18), transparent 25%);
    animation: drift 4s ease-in-out infinite alternate;
  }
  @keyframes drift { 0%{transform:translate(0,0);} 100%{transform:translate(-40px,25px);} }
  .banner::after {
    content:''; position:absolute; top:0; left:-30%; width:30%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
    animation: scan 4s linear infinite;
  }
  @keyframes scan { 0%{left:-30%;} 100%{left:130%;} }
  .bar-left,.bar-right { position:absolute; top:0; width:4px; height:100%; animation:barpulse 2s ease-in-out infinite; }
  .bar-left { left:0; background:linear-gradient(180deg,#00E5A0,#00b584); box-shadow:0 0 20px #00E5A0; }
  .bar-right { right:0; background:linear-gradient(180deg,#9146FF,#6a2fd0); box-shadow:0 0 20px #9146FF; animation-delay:1s; }
  @keyframes barpulse { 0%,100%{opacity:0.6;} 50%{opacity:1;} }
  .particle { position:absolute; border-radius:50%; pointer-events:none; animation:float linear infinite; }
  @keyframes float { 0%{transform:translateY(310px) scale(0);opacity:0;} 10%{opacity:1;transform:scale(1);} 90%{opacity:1;} 100%{transform:translateY(-20px) scale(0.5);opacity:0;} }
  .content { position:absolute; inset:0; display:grid; grid-template-columns:340px 1fr 300px; align-items:center; z-index:5; }
  .hexwrap { position:relative; height:100%; }
  .hex { position:absolute; width:66px; height:74px; display:flex; align-items:center; justify-content:center; font-size:24px;
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); animation:bob 2s ease-in-out infinite; }
  .hex.b1{ left:40px; top:48px; background:linear-gradient(180deg,#3a2200,#1a0e00); box-shadow:0 0 14px rgba(205,127,50,0.5) inset, 0 0 12px rgba(205,127,50,0.4); }
  .hex.b2{ left:40px; top:160px; background:linear-gradient(180deg,#222,#111); box-shadow:0 0 12px rgba(192,192,192,0.4); animation-delay:.5s; }
  .hex.b3{ left:128px; top:24px; width:78px; height:88px; font-size:30px; background:linear-gradient(180deg,#2a2000,#140f00); box-shadow:0 0 20px rgba(255,215,0,0.6); animation-delay:.25s; }
  .hex.b4{ left:132px; top:150px; background:linear-gradient(180deg,#002323,#001313); box-shadow:0 0 14px rgba(0,229,255,0.5); animation-delay:.75s; }
  .hex.b5{ left:222px; top:60px; background:linear-gradient(180deg,#04231a,#01130d); box-shadow:0 0 14px rgba(0,229,160,0.5); animation-delay:1s; }
  .hex.b6{ left:226px; top:168px; width:58px; height:64px; background:linear-gradient(180deg,#16002a,#0a0014); box-shadow:0 0 12px rgba(145,70,255,0.5); animation-delay:1.5s; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }
  .center { text-align:center; padding:0 10px; }
  .title { font-size:50px; font-weight:900; line-height:0.95; color:#fff; letter-spacing:1px; text-shadow:0 0 22px rgba(0,229,160,0.4); }
  .title b { background:linear-gradient(180deg,#00E5A0,#00a877); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .sub { font-size:24px; font-weight:900; letter-spacing:4px; color:#00E5A0; margin-top:2px; }
  .divider { width:280px; height:1px; margin:12px auto; background:linear-gradient(90deg,transparent,#00E5A0,#9146FF,transparent); animation:dividerGlow 2s ease-in-out infinite; }
  @keyframes dividerGlow { 0%,100%{opacity:0.5;} 50%{opacity:1;} }
  .desc { font-size:13.5px; color:rgba(255,255,255,0.55); }
  .pills { display:flex; gap:8px; justify-content:center; margin-top:12px; }
  .pill { font-size:10px; letter-spacing:1px; padding:4px 10px; border-radius:4px; }
  .pill.bz{ color:#CD7F32; background:rgba(205,127,50,0.18);} .pill.sv{ color:#C0C0C0; background:rgba(192,192,192,0.18);}
  .pill.gd{ color:#FFD700; background:rgba(255,215,0,0.18);} .pill.dm{ color:#00E5FF; background:rgba(0,229,255,0.18);}
  .pill.sp{ color:#9146FF; background:rgba(145,70,255,0.18);}
  .tagline { font-size:11px; letter-spacing:3px; color:#00E5A0; opacity:0.65; margin-top:12px; }
  .right { position:relative; height:100%; }
  .rhex { position:absolute; width:64px; height:72px; display:flex; align-items:center; justify-content:center; font-size:22px;
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); animation:bob 2s ease-in-out infinite; opacity:0.8; }
  .rhex.r1{ right:170px; top:40px; background:linear-gradient(180deg,#16002a,#0a0014); box-shadow:0 0 12px rgba(145,70,255,0.4); }
  .rhex.r2{ right:96px; top:96px; background:linear-gradient(180deg,#2a2000,#140f00); box-shadow:0 0 12px rgba(255,215,0,0.4); animation-delay:.6s; }
  .rhex.r3{ right:30px; top:46px; background:linear-gradient(180deg,#04231a,#01130d); box-shadow:0 0 12px rgba(0,229,160,0.4); animation-delay:.3s; }
  .rhex.q{ font-size:20px; color:rgba(255,255,255,0.3); opacity:0.5; background:linear-gradient(180deg,#181820,#0e0e14); box-shadow:none; }
  .rhex.q1{ right:150px; top:160px; } .rhex.q2{ right:70px; top:170px; }
</style></head><body>
  <div class="banner" id="banner">
    <div class="bar-left"></div><div class="bar-right"></div>
    <div class="content">
      <div class="hexwrap">
        <div class="hex b1">🥉</div><div class="hex b2">🥈</div><div class="hex b3">👑</div>
        <div class="hex b4">💎</div><div class="hex b5">⚡</div><div class="hex b6">🚀</div>
      </div>
      <div class="center">
        <div class="title">CONQUISTAS</div>
        <div class="sub">DA COMUNIDADE</div>
        <div class="divider"></div>
        <div class="desc">Desbloqueie badges. Suba no ranking. Seja reconhecido.</div>
        <div class="pills">
          <div class="pill bz">BRONZE</div><div class="pill sv">SILVER</div>
          <div class="pill gd">GOLD</div><div class="pill dm">DIAMOND</div><div class="pill sp">SPECIAL</div>
        </div>
        <div class="tagline">DISTRIBUIR · MULTIPLICAR · ESCALAR</div>
      </div>
      <div class="right">
        <div class="rhex r1">🔥</div><div class="rhex r2">🏆</div><div class="rhex r3">⭐</div>
        <div class="rhex q q1">?</div><div class="rhex q q2">?</div>
      </div>
    </div>
  </div>
  <script>
    const banner=document.getElementById('banner');
    const colors=['#00E5A0','#9146FF','#FFD700'];
    function sp(){const p=document.createElement('div');p.className='particle';const s=Math.random()*4+2;p.style.width=s+'px';p.style.height=s+'px';const c=colors[Math.floor(Math.random()*colors.length)];p.style.background=c;p.style.boxShadow='0 0 8px '+c;p.style.left=Math.random()*100+'%';p.style.animationDuration=(Math.random()*2+2)+'s';banner.appendChild(p);setTimeout(()=>p.remove(),4000);}
    setInterval(sp,320);for(let i=0;i<9;i++)setTimeout(sp,i*160);
  </script>
</body></html>
