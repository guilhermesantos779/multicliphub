<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:300px; overflow:hidden; font-family:'Inter',Arial,sans-serif; }
  .banner {
    position:relative; width:1200px; height:300px; overflow:hidden;
    background:
      radial-gradient(ellipse 70% 120% at 25% 50%, rgba(145,70,255,0.34), transparent 55%),
      radial-gradient(ellipse 60% 100% at 85% 100%, rgba(0,229,160,0.12), transparent 55%),
      linear-gradient(135deg, #0c0617 0%, #050507 55%, #08060c 100%);
  }
  .banner::before {
    content:''; position:absolute; inset:-50%;
    background:radial-gradient(circle at 25% 50%, rgba(145,70,255,0.24), transparent 24%);
    animation: drift 4s ease-in-out infinite alternate;
  }
  @keyframes drift { 0%{transform:translate(0,0);} 100%{transform:translate(36px,18px);} }
  .banner::after {
    content:''; position:absolute; top:0; left:-30%; width:30%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(145,70,255,0.08), transparent);
    animation: scan 4s linear infinite;
  }
  @keyframes scan { 0%{left:-30%;} 100%{left:130%;} }
  .bar-left,.bar-right { position:absolute; top:0; width:4px; height:100%; animation:barpulse 2s ease-in-out infinite; }
  .bar-left { left:0; background:linear-gradient(180deg,#9146FF,#6a2fd0); box-shadow:0 0 22px #9146FF; }
  .bar-right { right:0; background:linear-gradient(180deg,#9146FF,#4d23a0); box-shadow:0 0 18px #9146FF; animation-delay:1s; }
  @keyframes barpulse { 0%,100%{opacity:0.6;} 50%{opacity:1;} }
  .particle { position:absolute; border-radius:50%; pointer-events:none; animation:float linear infinite; }
  @keyframes float { 0%{transform:translateY(310px) scale(0);opacity:0;} 10%{opacity:1;transform:scale(1);} 90%{opacity:1;} 100%{transform:translateY(-20px) scale(0.5);opacity:0;} }
  .content { position:absolute; inset:0; display:grid; grid-template-columns:340px 1fr; align-items:center; z-index:5; }
  .trophywrap { position:relative; height:100%; }
  .ring { position:absolute; top:50%; left:170px; transform:translate(-50%,-50%); border-radius:50%; border:2px solid rgba(145,70,255,0.5); animation:pulse 2s ease-out infinite; }
  .ring.r1{ width:96px;height:96px;} .ring.r2{ width:96px;height:96px;animation-delay:1s;}
  @keyframes pulse { 0%{width:96px;height:96px;opacity:0.85;} 100%{width:220px;height:220px;opacity:0;} }
  .trophy { position:absolute; top:50%; left:170px; transform:translate(-50%,-50%); font-size:92px; filter:drop-shadow(0 0 22px rgba(145,70,255,0.8)); animation:bob 2s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translate(-50%,-50%) translateY(0);} 50%{transform:translate(-50%,-50%) translateY(-8px);} }
  .right { padding-right:48px; }
  .eyebrow { font-size:14px; letter-spacing:5px; color:#9146FF; font-weight:700; text-shadow:0 0 14px rgba(145,70,255,0.7); }
  .title { font-size:48px; font-weight:900; line-height:1; margin-top:4px; color:#fff; text-shadow:0 0 22px rgba(145,70,255,0.45); }
  .title b{ color:#b98aff; }
  .badge { display:inline-block; margin-top:8px; font-size:12px; font-weight:900; letter-spacing:2px; color:#fff; background:linear-gradient(180deg,#9146FF,#6a2fd0); padding:5px 14px; border-radius:6px; }
  .divider { width:440px; height:2px; margin:12px 0; background:linear-gradient(90deg,#9146FF,transparent); animation:dividerGlow 2s ease-in-out infinite; }
  @keyframes dividerGlow { 0%,100%{opacity:0.5;} 50%{opacity:1;} }
  .tags { display:flex; gap:10px; flex-wrap:wrap; max-width:560px; margin-top:2px; }
  .tag { font-size:12px; color:rgba(255,255,255,0.82); background:rgba(145,70,255,0.12); padding:6px 12px; border-radius:5px; }
  .tagline { font-size:11px; letter-spacing:3px; color:#00E5A0; opacity:0.55; margin-top:14px; }
</style></head><body>
  <div class="banner" id="banner">
    <div class="bar-left"></div><div class="bar-right"></div>
    <div class="content">
      <div class="trophywrap">
        <div class="ring r1"></div><div class="ring r2"></div>
        <div class="trophy">🏆</div>
      </div>
      <div class="right">
        <div class="eyebrow">SALA PRO</div>
        <div class="title">EXCLUSIVO <b>PRO+</b></div>
        <div class="badge">🏆 PRO</div>
        <div class="divider"></div>
        <div class="tags">
          <div class="tag">📈 Estratégias avançadas</div>
          <div class="tag">🎯 Feedback da equipe</div>
          <div class="tag">⚡ Acesso antecipado</div>
          <div class="tag">🤝 Networking premium</div>
        </div>
        <div class="tagline">DISTRIBUIR · MULTIPLICAR · ESCALAR</div>
      </div>
    </div>
  </div>
  <script>
    const banner=document.getElementById('banner');
    const colors=['#9146FF','#b98aff'];
    function sp(){const p=document.createElement('div');p.className='particle';const s=Math.random()*3+2;p.style.width=s+'px';p.style.height=s+'px';const c=colors[Math.floor(Math.random()*colors.length)];p.style.background=c;p.style.boxShadow='0 0 8px '+c;p.style.left=Math.random()*100+'%';p.style.animationDuration=(Math.random()*2+2)+'s';banner.appendChild(p);setTimeout(()=>p.remove(),4000);}
    setInterval(sp,300);for(let i=0;i<10;i++)setTimeout(sp,i*150);
  </script>
</body></html>
